<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2E3A"/>
      <stop offset="55%" stop-color="#243B48"/>
      <stop offset="100%" stop-color="#122028"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EB8C9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7EB8C9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>
  <circle cx="900" cy="120" r="220" fill="url(#lamp)"/>
  <!-- floor -->
  <rect x="0" y="560" width="1200" height="240" fill="#0E181E"/>
  <!-- window panes behind desk -->
  <rect x="80" y="120" width="320" height="280" rx="6" fill="#1E3542"/>
  <rect x="100" y="140" width="130" height="100" rx="4" fill="#6FA3B5" opacity="0.45"/>
  <rect x="250" y="140" width="130" height="100" rx="4" fill="#6FA3B5" opacity="0.35"/>
  <rect x="100" y="260" width="130" height="100" rx="4" fill="#6FA3B5" opacity="0.3"/>
  <rect x="250" y="260" width="130" height="100" rx="4" fill="#6FA3B5" opacity="0.4"/>
  <!-- interview chairs -->
  <rect x="180" y="480" width="90" height="70" rx="8" fill="#2A4452"/>
  <rect x="200" y="450" width="50" height="40" rx="6" fill="#355564"/>
  <rect x="320" y="490" width="90" height="60" rx="8" fill="#2A4452"/>
  <rect x="340" y="460" width="50" height="40" rx="6" fill="#355564"/>
  <!-- hiring desk -->
  <rect x="480" y="430" width="520" height="160" rx="10" fill="#1C303C"/>
  <rect x="500" y="450" width="280" height="12" rx="3" fill="#7EB8C9" opacity="0.55"/>
  <!-- CV stack -->
  <rect x="520" y="480" width="70" height="90" rx="4" fill="#E8F0F4" opacity="0.92"/>
  <rect x="530" y="495" width="50" height="4" rx="1" fill="#2A4452" opacity="0.5"/>
  <rect x="530" y="508" width="40" height="3" rx="1" fill="#2A4452" opacity="0.35"/>
  <rect x="530" y="518" width="45" height="3" rx="1" fill="#2A4452" opacity="0.35"/>
  <rect x="535" y="475" width="70" height="90" rx="4" fill="#D5E4EB" opacity="0.85"/>
  <rect x="550" y="470" width="70" height="90" rx="4" fill="#F4F8FA"/>
  <rect x="560" y="488" width="50" height="4" rx="1" fill="#1A2E3A" opacity="0.45"/>
  <rect x="560" y="500" width="42" height="3" rx="1" fill="#1A2E3A" opacity="0.3"/>
  <rect x="560" y="510" width="48" height="3" rx="1" fill="#1A2E3A" opacity="0.3"/>
  <!-- laptop -->
  <rect x="720" y="470" width="140" height="88" rx="6" fill="#2F4A58"/>
  <rect x="732" y="482" width="116" height="64" rx="3" fill="#7EB8C9" opacity="0.35"/>
  <rect x="760" y="558" width="60" height="8" rx="2" fill="#243B48"/>
  <!-- side cabinet / queue rail -->
  <rect x="1020" y="400" width="100" height="190" rx="8" fill="#243B48"/>
  <rect x="1035" y="420" width="70" height="8" rx="2" fill="#7EB8C9" opacity="0.4"/>
  <rect x="1035" y="450" width="70" height="8" rx="2" fill="#7EB8C9" opacity="0.3"/>
  <rect x="1035" y="480" width="70" height="8" rx="2" fill="#7EB8C9" opacity="0.3"/>
  <!-- soft desk lamp glow -->
  <ellipse cx="740" cy="620" rx="280" ry="36" fill="#7EB8C9" opacity="0.12"/>
  <ellipse cx="280" cy="600" rx="160" ry="24" fill="#7EB8C9" opacity="0.08"/>
</svg>
