<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="55%" stop-color="#1A455C"/>
      <stop offset="100%" stop-color="#0B1F2A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D7FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="900" cy="160" r="220" fill="url(#glow)"/>
  <!-- lobby sill -->
  <rect x="0" y="520" width="1200" height="280" fill="#0A1820"/>
  <!-- reception desk -->
  <rect x="280" y="460" width="640" height="90" rx="10" fill="#16384A"/>
  <rect x="300" y="478" width="600" height="12" rx="4" fill="#00D7FF" opacity="0.7"/>
  <!-- columns -->
  <rect x="160" y="220" width="36" height="300" fill="#1E4A5E"/>
  <rect x="1004" y="220" width="36" height="300" fill="#1E4A5E"/>
  <!-- window panes -->
  <rect x="240" y="180" width="720" height="260" rx="8" fill="#0E2A3A" stroke="#00D7FF" stroke-opacity="0.25" stroke-width="3"/>
  <line x1="480" y1="180" x2="480" y2="440" stroke="#00D7FF" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="720" y1="180" x2="720" y2="440" stroke="#00D7FF" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="240" y1="310" x2="960" y2="310" stroke="#00D7FF" stroke-opacity="0.18" stroke-width="2"/>
  <!-- soft floor light -->
  <ellipse cx="600" cy="620" rx="280" ry="36" fill="#00D7FF" opacity="0.12"/>
</svg>
