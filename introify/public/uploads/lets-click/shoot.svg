<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2430"/>
      <stop offset="55%" stop-color="#243448"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EB8D8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7EB8D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="860" cy="160" r="240" fill="url(#glow)"/>
  <!-- floor -->
  <rect x="0" y="540" width="1200" height="260" fill="#0A1018"/>
  <!-- backdrop -->
  <rect x="180" y="160" width="840" height="380" rx="12" fill="#162030" stroke="#7EB8D8" stroke-opacity="0.3" stroke-width="3"/>
  <line x1="180" y1="350" x2="1020" y2="350" stroke="#7EB8D8" stroke-opacity="0.12" stroke-width="2"/>
  <!-- camera body -->
  <rect x="470" y="300" width="220" height="140" rx="18" fill="#2A3A4C"/>
  <circle cx="580" cy="370" r="48" fill="#0E1620" stroke="#9ED0EA" stroke-width="6"/>
  <circle cx="580" cy="370" r="22" fill="#7EB8D8" opacity="0.55"/>
  <!-- flash / grip -->
  <rect x="510" y="270" width="50" height="36" rx="8" fill="#3A4E64"/>
  <rect x="660" y="330" width="40" height="70" rx="8" fill="#3A4E64"/>
  <!-- soft floor light -->
  <ellipse cx="600" cy="620" rx="260" ry="32" fill="#7EB8D8" opacity="0.14"/>
</svg>
